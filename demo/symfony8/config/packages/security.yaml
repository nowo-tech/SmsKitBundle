security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        users_in_memory:
            memory: null

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            # Demo: the settings UI uses allow_unauthenticated (dev only). A host protects the prefix instead:
            #   access_control: [{ path: ^/admin/settings, roles: ROLE_ADMIN }]
            security: false

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
