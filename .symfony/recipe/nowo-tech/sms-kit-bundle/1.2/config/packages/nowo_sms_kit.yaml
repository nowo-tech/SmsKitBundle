# Nowo SMS Kit — DB-only mode: the provider, the sender and the credentials live only in the "sms" instance settings
# section (/admin/settings/sections/sms, secrets encrypted). No environment variable is needed; until a provider is
# chosen there, sending is disabled (null provider).
# Migrating from %env()% fallbacks: keep them wired, run
#   php bin/console nowo:instance-settings:seed-from-fallbacks --section=sms
# and remove them afterwards. Reference: https://github.com/nowo-tech/SmsKitBundle/blob/main/docs/USAGE.md#db-only-mode
nowo_sms_kit:
    http:
        timeout: 5.0
        max_duration: 15.0
        # Self-hosted SMS Bridge on a private network (keep resolve_dns: true — Docker service names resolve too, and the
        # answer is checked against cloud metadata and pinned; resolve_dns: false would accept any hostname):
        # allow_private_endpoints: true
        # require_https: false
        allow_private_endpoints: false
        resolve_dns: true
        require_https: true
        max_response_bytes: 65536

    # Destination / cost policy (SMS pumping, toll fraud): premium / satellite prefixes are refused by default.
    # destinations:
    #     allowed_country_codes: ['34']
    #     rate_limit:
    #         per_destination: { enabled: true, limit: 3, interval: '1 hour' }
    #         global: { enabled: true, limit: 500, interval: '1 day' }

    test_action:
        enabled: true
        rate_limit:
            limit: 5
            interval: '15 minutes'

    # auth_kit:
