# Nowo SMS Kit — the provider and its credentials are chosen at runtime in the "sms" instance settings section
# (/admin/settings/sections/sms). The values below are fallbacks used while the section stores nothing.
# Reference: https://github.com/nowo-tech/SmsKitBundle/blob/main/docs/CONFIGURATION.md
nowo_sms_kit:
    # null (disabled), log, twilio, sms_bridge or a host provider name.
    default_provider: '%env(SMS_PROVIDER)%'
    # sender: '%env(default::SMS_SENDER)%'

    http:
        timeout: 5.0
        max_duration: 15.0
        # Self-hosted SMS Bridge on a private network (keep resolve_dns: true — Docker service names resolve too, and the
        # answer is checked against cloud metadata and pinned; resolve_dns: false would accept any hostname):
        # allow_private_endpoints: true
        # require_https: false
        allow_private_endpoints: false
        resolve_dns: true
        require_https: true
        max_response_bytes: 65536

    # Destination / cost policy (SMS pumping, toll fraud): premium / satellite prefixes are refused by default.
    # destinations:
    #     allowed_country_codes: ['34']
    #     rate_limit:
    #         per_destination: { enabled: true, limit: 3, interval: '1 hour' }
    #         global: { enabled: true, limit: 500, interval: '1 day' }

    # providers:
    #     twilio:
    #         account_sid: '%env(default::TWILIO_ACCOUNT_SID)%'
    #         auth_token: '%env(default::TWILIO_AUTH_TOKEN)%'
    #         messaging_service_sid: '%env(default::TWILIO_MESSAGING_SERVICE_SID)%'
    #     sms_bridge:
    #         base_url: '%env(default::SMS_BRIDGE_BASE_URL)%'
    #         api_mode: twilio
    #         account_sid: '%env(default::SMS_BRIDGE_ACCOUNT_SID)%'
    #         auth_token: '%env(default::SMS_BRIDGE_AUTH_TOKEN)%'

    test_action:
        enabled: true
        rate_limit:
            limit: 5
            interval: '15 minutes'

    # auth_kit:
    #     password_reset:
    #         enabled: true
    #         phone_property: phone
    #         delivery: deferred      # sent after the response; messenger for an async transport
